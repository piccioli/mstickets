name: ticket-uat

services:
  app:
    image: ${IMAGE:-ghcr.io/piccioli/mstickets-uat:latest}
    restart: unless-stopped
    mem_limit: ${MEM_LIMIT_APP:-512m}
    env_file: .env.uat
    ports:
      - "127.0.0.1:8090:8000"
    volumes:
      # Allegati v1 (media.file_name, TicketAttachmentsStage) per l'ETL reale
      # (design ETL real data seeding, §4): l'immagine UAT non monta l'intero
      # repo come in locale, quindi qui serve un bind-mount dedicato su un
      # percorso del disco host di msuat, popolato da un umano con
      # `bin/fetch-legacy-media` + scp/rsync verso msuat (mai un accesso diretto
      # msuat -> produzione). Monta direttamente su storage/app/v1-media (stesso
      # path di default letto da LEGACY_MEDIA_PATH, config/filesystems.php): non
      # serve valorizzare LEGACY_MEDIA_PATH in .env.uat.
      - ${LEGACY_MEDIA_HOST_PATH:-/opt/mstickets-uat/v1-media}:/app/storage/app/v1-media
      # Datapack RUNTS-CAI (Fase 8, sezioni/sottosezioni CAI): stesso principio
      # del bind-mount sopra, ma in sola lettura (il comando cai:import-datapack
      # apre il file .sqlite con PDO::SQLITE_OPEN_READONLY e copia gli allegati
      # verso lo storage privato, non scrive mai dentro questa cartella).
      # Popolato su msuat con bin/push-cai-datapack (mai da CI, il datapack non
      # è mai versionato con git).
      - ${CAI_DATAPACK_HOST_PATH:-/opt/mstickets-uat/cai-datapack}:/app/cai-datapack:ro
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      # L'immagine base FrankenPHP ha un HEALTHCHECK ereditato che interroga
      # l'admin API di Caddy su :2019 (curl http://localhost:2019/metrics),
      # mai esposta da "frankenphp php-server" (admin endpoint disabilitato
      # di proposito): risultava sempre "unhealthy" a torto. Sovrascritto
      # per controllare la porta HTTP realmente servita.
      test: ["CMD-SHELL", "curl -f http://localhost:8000/admin/login || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - ticket-uat

  worker:
    image: ${IMAGE:-ghcr.io/piccioli/mstickets-uat:latest}
    restart: unless-stopped
    mem_limit: ${MEM_LIMIT_WORKER:-256m}
    env_file: .env.uat
    entrypoint: ["/app/docker/uat/worker-entrypoint.sh"]
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      # Stesso HEALTHCHECK ereditato di "app" (nessuna porta HTTP qui):
      # disabilitato esplicitamente, la liveness dei due processi e' gia'
      # garantita da restart_loop in worker-entrypoint.sh.
      disable: true
    networks:
      - ticket-uat

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    mem_limit: ${MEM_LIMIT_DB:-384m}
    environment:
      POSTGRES_DB: ${DB_DATABASE:-ticket_uat}
      POSTGRES_USER: ${DB_USERNAME:-ticket_uat}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?err}
    volumes:
      - ticket_uat_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-ticket_uat}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - ticket-uat

  db_legacy:
    # Sorgente v1 in sola lettura per l'ETL reale (design ETL real data seeding,
    # §4): a differenza del servizio locale equivalente (docker-compose.yml,
    # dietro il profilo "etl"), qui è SEMPRE attivo perché serve a ogni deploy
    # su develop (US-R06), non a una sessione ETL occasionale.
    image: postgres:16-alpine
    restart: unless-stopped
    mem_limit: ${MEM_LIMIT_DB_LEGACY:-384m}
    environment:
      POSTGRES_DB: ${DB_LEGACY_DATABASE:-orchestrator_legacy}
      POSTGRES_USER: ${DB_LEGACY_USERNAME:-orchestrator_legacy}
      POSTGRES_PASSWORD: ${DB_LEGACY_PASSWORD:?err}
    volumes:
      - db_legacy_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_LEGACY_USERNAME:-orchestrator_legacy}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - ticket-uat

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    mem_limit: ${MEM_LIMIT_REDIS:-128m}
    command: ["redis-server", "--maxmemory", "100mb", "--maxmemory-policy", "allkeys-lru"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - ticket-uat

  mailpit:
    image: axllent/mailpit:latest
    restart: unless-stopped
    mem_limit: ${MEM_LIMIT_MAILPIT:-128m}
    command: ["--max", "500"]
    ports:
      - "127.0.0.1:8091:8025"
    networks:
      - ticket-uat

networks:
  ticket-uat:
    driver: bridge

volumes:
  ticket_uat_db_data:
  db_legacy_data:
