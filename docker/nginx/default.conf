server {
    listen 80;
    server_name _;
    root /var/www/html/public;
    index index.php;

    client_max_body_size 100M;

    add_header X-Frame-Options "SAMEORIGIN";
    add_header X-Content-Type-Options "nosniff";

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        fastcgi_pass app:9000;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        include fastcgi_params;
        # Il default nginx (60s) è più corto del timeout HTTP lato PHP verso il servizio
        # cai-runts-scraper (config('cai_directory.runts_scraper.scrape_timeout_seconds'),
        # 150s) usato da SyncCaiRuntsRegistration/ScrapeCaiSection (Fase 9): senza questo,
        # nginx abbandona la richiesta con un 502 prima che PHP possa rispondere, anche se
        # lo scrape sta procedendo correttamente lato server.
        fastcgi_read_timeout 180s;
        fastcgi_send_timeout 180s;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }
}
