name: orchestrator-v2

x-app-build: &app-build
  context: .
  dockerfile: docker/php/Dockerfile
  args:
    UID: ${WWWUSER:-1000}
    GID: ${WWWGROUP:-1000}

x-app-depends-on: &app-depends-on
  db:
    condition: service_healthy
  redis:
    condition: service_healthy

services:
  app:
    build: *app-build
    volumes:
      - .:/var/www/html
    env_file: .env
    depends_on: *app-depends-on
    healthcheck:
      test: ["CMD", "sh", "-c", "SCRIPT_NAME=/ping SCRIPT_FILENAME=/ping REQUEST_METHOD=GET cgi-fcgi -bind -connect 127.0.0.1:9000"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - orchestrator

  web:
    image: nginx:alpine
    volumes:
      - .:/var/www/html:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "${APP_PORT:-8080}:80"
    depends_on:
      app:
        condition: service_healthy
    networks:
      - orchestrator

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${DB_DATABASE:-orchestrator}
      POSTGRES_USER: ${DB_USERNAME:-orchestrator}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-orchestrator}
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-orchestrator} -d ${DB_DATABASE:-orchestrator}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - orchestrator

  redis:
    image: redis:7-alpine
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - orchestrator

  queue:
    build: *app-build
    command: php artisan horizon
    volumes:
      - .:/var/www/html
    env_file: .env
    depends_on: *app-depends-on
    restart: always
    networks:
      - orchestrator

  scheduler:
    build: *app-build
    command: php artisan schedule:work
    volumes:
      - .:/var/www/html
    env_file: .env
    depends_on: *app-depends-on
    restart: always
    networks:
      - orchestrator

  mailpit:
    image: axllent/mailpit
    ports:
      - "${MAILPIT_SMTP_PORT:-1025}:1025"
      - "${MAILPIT_UI_PORT:-8025}:8025"
    networks:
      - orchestrator

volumes:
  db_data:
  redis_data:

networks:
  orchestrator:
    driver: bridge
